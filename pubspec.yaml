name: music
description: A modern Flutter music player app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  just_audio: ^0.10.5
  audio_service: ^0.18.12
  permission_handler: ^12.0.1
  on_audio_query: ^2.9.0
  provider: ^6.1.1
  share_plus: ^12.0.1
  rxdart: ^0.28.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
